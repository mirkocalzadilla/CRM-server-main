[project]
name = "marketing-services-server"
version = "0.1.0"
description = "Backend FastAPI para plataforma de marketing con IA"
authors = [{ name = "Natalia", email = "ernstrockdev@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic==2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "anthropic>=1.2.0,<2",
    "openai>=2.0.0,<3",
    "httpx>=0.27.2",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.68.1,<3",
    "redis>=5.2.0",
    "typer>=0.12.5",
    "tzdata>=2024.1",
    "email-validator>=2.1.0",
    "aiofiles>=24.1.0",
    "segno>=1.6.6",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
marketing-cli = "server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
