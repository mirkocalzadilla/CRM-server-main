name: Stale PR reminder

# Recuerda al autor mergear su propio PR si lleva demasiado tiempo abierto.
# Convención del equipo: el autor mergea su propio PR (ver CONTRIBUTING.md).
# Nota: los workflows 'schedule' solo corren desde la rama por defecto (main).

on:
  schedule:
    - cron: '0 13,21 * * 1-5'   # 13:00 y 21:00 UTC, lun-vie
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

env:
  STALE_HOURS: '12'

jobs:
  remind:
    runs-on: ubuntu-latest
    name: Remind authors to merge
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const STALE_HOURS = Number(process.env.STALE_HOURS);
            const MARKER = '<!-- stale-pr-reminder -->';
            const now = Date.now();
            const { owner, repo } = context.repo;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const pr of prs) {
              if (pr.draft) continue;

              const updatedAt = new Date(pr.updated_at).getTime();
              const hours = (now - updatedAt) / 36e5;
              if (hours < STALE_HOURS) continue;

              // No repetir: saltar si ya avisamos después del último cambio del PR.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const alreadyReminded = comments.some(
                c => c.body.includes(MARKER) && new Date(c.created_at).getTime() >= updatedAt
              );
              if (alreadyReminded) continue;

              const body = [
                MARKER,
                `@${pr.user.login} este PR lleva ~${Math.floor(hours)} h abierto sin cambios.`,
                '',
                'Convención del equipo: **el autor mergea su propio PR** en cuanto CI está verde.',
                'Si ya está listo, dale merge. Si no, ignora este aviso (volverá a recordarte tras el próximo cambio).',
              ].join('\n');

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
              core.info(`Reminded PR #${pr.number} (${Math.floor(hours)}h)`);
            }
